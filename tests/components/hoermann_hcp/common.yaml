hoermann_hcp:
  id: hoermann_hcp_hub
  modbus_id: modbus_server_bus

cover:
  - platform: hoermann_hcp
    name: Garage Door
    device_class: garage

binary_sensor:
  - platform: hoermann_hcp
    is_connected:
      name: Garage Connected
    is_relay_on:
      name: Garage Relay

button:
  - platform: hoermann_hcp
    vent:
      name: Garage Vent
    half_open:
      name: Garage Half Open

light:
  - platform: hoermann_hcp
    name: Garage Light

text_sensor:
  - platform: hoermann_hcp
    name: Garage Door State

switch:
  - platform: hoermann_hcp
    vent:
      name: Garage Vent Switch
    half_open:
      name: Garage Half Open Switch
